<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Крестики-нолики: Неон</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #39ff14;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      text-shadow: 0 0 10px #39ff14;
    }

    h2 {
      font-size: 2rem;
      color: #00f7ff;
      text-shadow: 0 0 15px #00f7ff;
      margin-bottom: 20px;
    }

    #tic-tac-toe-board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-gap: 15px;
      margin: 20px 0;
    }

    #tic-tac-toe-board div {
      width: 100px;
      height: 100px;
      background: #111;
      border: 2px solid #00f7ff;
      box-shadow: 0 0 20px #00f7ff33;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      color: #ff00ff;
      cursor: pointer;
      border-radius: 15px;
      user-select: none;
      transition: 0.3s;
    }

    #tic-tac-toe-board div:hover {
      background-color: #222;
      box-shadow: 0 0 30px #00f7ff88;
    }

    .winning-cell {
      animation: neon-blink 0.6s infinite alternate;
    }

    @keyframes neon-blink {
      0% {
        background-color: #ff00ff;
        box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;
      }
      100% {
        background-color: #ff1493;
        box-shadow: 0 0 25px #ff1493, 0 0 45px #ff1493;
      }
    }

    #game-status {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #39ff14;
      text-shadow: 0 0 8px #39ff14;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      background: linear-gradient(135deg, #00f7ff, #ff00ff);
      color: white;
      box-shadow: 0 0 15px #00f7ff;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #00f7ff, 0 0 30px #ff00ff;
    }

    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #00f7ff, #ff00ff);
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      margin: 10px;
      box-shadow: 0 0 15px #ff00ff;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px #ff00ff, 0 0 35px #00f7ff;
    }

  </style>
</head>
<body>

  <h2>🎮 Tic-Tac-Toe</h2>
  <div id="tic-tac-toe-board"></div>
  <p id="game-status"></p>
  <button onclick="restartGame()">🔁 Қайтадан бастау</button>
  <a href="index.html" class="btn">← Артқа</a>

  <script>
    const board = Array(9).fill(null);
    let currentPlayer = '❌';
    let gameActive = true;
    const human = '❌';
    const ai = '⭕';

    const winningCombos = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function createBoard() {
      const container = document.getElementById('tic-tac-toe-board');
      container.innerHTML = '';
      board.forEach((cell, i) => {
        const div = document.createElement('div');
        div.dataset.index = i;
        div.innerText = cell || '';
        div.onclick = () => makeMove(i);
        container.appendChild(div);
      });
      updateStatus(`Ход: ${currentPlayer}`);
    }

    function makeMove(index) {
      if (!gameActive || board[index]) return;

      board[index] = human;
      updateBoard();
      if (checkEndGame(human)) return;

      setTimeout(() => {
        aiMove();
        updateBoard();
        checkEndGame(ai);
      }, 300);
    }

    function aiMove() {
        if (!gameActive) return;

        let bestScore = -Infinity;
        let move;
        board.forEach((cell, i) => {
            if (cell === null) {
                board[i] = ai;
                const score = minimax(board, 0, false);
                board[i] = null;
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
            }
        });

        if (move !== undefined) {
            board[move] = ai;
        }
    }

    function minimax(newBoard, depth, isMaximizing) {
        const winner = checkWinner(newBoard);
        if (winner === ai) return 1;
        if (winner === human) return -1;
        if (newBoard.every(cell => cell !== null)) return 0;

        if (isMaximizing) {
            let bestScore = -Infinity;
            newBoard.forEach((cell, i) => {
                if (cell === null) {
                    newBoard[i] = ai;
                    const score = minimax(newBoard, depth + 1, false);
                    newBoard[i] = null;
                    bestScore = Math.max(score, bestScore);
                }
            });
            return bestScore;
        } else {
            let bestScore = Infinity;
            newBoard.forEach((cell, i) => {
                if (cell === null) {
                    newBoard[i] = human;
                    const score = minimax(newBoard, depth + 1, true);
                    newBoard[i] = null;
                    bestScore = Math.min(score, bestScore);
                }
            });
        return bestScore;
        }
    }

    function checkWinner(b) {
         for (let combo of winningCombos) {
            const [a, b1, c] = combo;
            if (b[a] && b[a] === b[b1] && b[a] === b[c]) return b[a];
        }
        return null;
    }

    function checkEndGame(player) {
      const winCombo = winningCombos.find(combo =>
        combo.every(i => board[i] === player)
      );

      if (winCombo) {
        gameActive = false;
        winCombo.forEach(i => {
          document.querySelector(`[data-index="${i}"]`).classList.add('winning-cell');
        });
        updateStatus(`🎉 ${player}: жеңіске жетті`);
        return true;
      }

      if (board.every(Boolean)) {
        updateStatus('🤝 Тең!');
        gameActive = false;
        return true;
      }

      currentPlayer = currentPlayer === '❌' ? '⭕' : '❌';
      updateStatus(`Ход: ${currentPlayer}`);
      return false;
    }

    function updateBoard() {
      board.forEach((val, i) => {
        document.querySelector(`[data-index="${i}"]`).innerText = val || '';
      });
    }

    function updateStatus(message) {
      document.getElementById('game-status').innerText = message;
    }

    function restartGame() {
      for (let i = 0; i < board.length; i++) board[i] = null;
      gameActive = true;
      currentPlayer = human;
      createBoard();
    }

    window.onload = createBoard;
  </script>

</body>
</html>
