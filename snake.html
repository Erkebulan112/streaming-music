<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🐍 SNAKE</title>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      font-family: 'Segoe UI', sans-serif;
      color: #39ff14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      text-shadow: 0 0 10px #39ff14;
    }

    canvas {
      background: #111;
      border: 2px solid #39ff14;
      box-shadow: 0 0 20px #39ff14;
      margin-bottom: 10px;
    }

    #score {
      font-size: 1.2rem;
      text-shadow: 0 0 10px #39ff14;
    }

    .btn {
      margin-top: 15px;
      padding: 10px 20px;
      background: linear-gradient(45deg, #39ff14, #00f0ff);
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px #00f0ff;
    }

    .btn:hover {
      filter: brightness(1.2);
    }
  </style>
</head>
<body>
  <h1>🐍 SNAKE</h1>
  <canvas id="game" width="300" height="300"></canvas>
  <div id="score">Ұпай: 0</div>
  <button class="btn" onclick="startGame()">🔁 Қайтадан бастау</button>
  <a href="index.html" class="btn">← Артқа</a>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const box = 20;
    const canvasSize = 15;
    let snake = [];
    let direction = 'RIGHT';
    let food;
    let score = 0;
    let gameInterval;
    let touchStartX, touchStartY;

    document.addEventListener("keydown", changeDirection);
    canvas.addEventListener("touchstart", startTouch, { passive: true });
    canvas.addEventListener("touchmove", moveTouch, { passive: true });

    function startGame() {
      clearInterval(gameInterval);
      snake = [{x: 5, y: 5}];
      direction = 'RIGHT';
      score = 0;
      spawnFood();
      gameInterval = setInterval(draw, 150);
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * canvasSize),
        y: Math.floor(Math.random() * canvasSize)
      };
    }

    function startTouch(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }

    function moveTouch(e) {
      let deltaX = e.touches[0].clientX - touchStartX;
      let deltaY = e.touches[0].clientY - touchStartY;

      if (Math.abs(deltaX) > Math.abs(deltaY)) {
        if (deltaX > 0 && direction !== 'LEFT') direction = 'RIGHT';
        if (deltaX < 0 && direction !== 'RIGHT') direction = 'LEFT';
      } else {
        if (deltaY > 0 && direction !== 'UP') direction = 'DOWN';
        if (deltaY < 0 && direction !== 'DOWN') direction = 'UP';
      }

      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }

    function changeDirection(e) {
      const key = e.key;
      if (key === "ArrowUp" && direction !== 'DOWN') direction = 'UP';
      else if (key === "ArrowDown" && direction !== 'UP') direction = 'DOWN';
      else if (key === "ArrowLeft" && direction !== 'RIGHT') direction = 'LEFT';
      else if (key === "ArrowRight" && direction !== 'LEFT') direction = 'RIGHT';
    }

    function draw() {
      ctx.fillStyle = "#0f0f0f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "#00f0ff" : "#39ff14";
        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fillRect(snake[i].x * box, snake[i].y * box, box, box);
      }

      ctx.fillStyle = "#ff0066";
      ctx.shadowColor = "#ff0066";
      ctx.fillRect(food.x * box, food.y * box, box, box);

      let head = { ...snake[0] };
      if (direction === "LEFT") head.x -= 1;
      if (direction === "RIGHT") head.x += 1;
      if (direction === "UP") head.y -= 1;
      if (direction === "DOWN") head.y += 1;

      // Столкновение со стеной или телом
      if (
        head.x < 0 || head.x >= canvasSize || head.y < 0 || head.y >= canvasSize ||
        snake.some(s => s.x === head.x && s.y === head.y)
      ) {
        clearInterval(gameInterval);
        alert("💀 Ойын соңы! Сіздің ұпайыңыз: " + score);
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").innerText = "Очки: " + score;
        spawnFood();
      } else {
        snake.pop();
      }
    }

    startGame();
  </script>
</body>
</html>
